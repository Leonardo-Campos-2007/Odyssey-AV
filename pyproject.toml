[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odyssey-av"
version = "0.1.0"
description = "Ferramenta modular de diagnóstico e análise de segurança para Windows e Linux."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Odyssey AV" }]
keywords = ["security", "cli", "diagnostics", "hash", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
odyssey = "odyssey_av.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "platform: testes dependentes do sistema operacional",
    "security: testes de controles de segurança",
]

[tool.coverage.run]
source = ["odyssey_av"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false